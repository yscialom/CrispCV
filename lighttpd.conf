# Generic web server configuration for any web app
server.document-root = "/var/www/localhost/htdocs"
server.port = 80

# HTTP Strict Transport Security (HSTS)
# Mitigates protocol downgrade attacks and cookie hijacking.
# Activate by uncommenting the following line and setting the max-age.
# server.hsts = "max-age=31536000; includeSubDomains; preload"

# Content Security Policy (CSP)
# Mitigates cross-site scripting (XSS) and data injection attacks.
# Customize the policy below to fit your application's needs.
# header.set = "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"

# X-Content-Type-Options
# Prevents browsers from MIME-sniffing a response away from the declared content-type.
header.set = "X-Content-Type-Options: nosniff"

# X-Frame-Options
# Protects against clickjacking attacks.
# Use "DENY" to prevent embedding, "SAMEORIGIN" to allow embedding from the same origin.
header.set = "X-Frame-Options: SAMEORIGIN"

# Referrer-Policy
# Controls how much referrer information is sent with requests.
# 'strict-origin-when-cross-origin' is a good default for privacy.
header.set = "Referrer-Policy: strict-origin-when-cross-origin"


server.modules += ( "mod_rewrite" )

# Fallback for Single Page Applications (SPA)
# If a requested file is not found, serve the index.html instead.
# This allows the client-side router to handle the URL.
url.rewrite-once = (
  "^/assets/.*" => "$0",
  "^/favicon.ico" => "$0",
  "^/([a-zA-Z0-9_-]+)\.(js|css|png|jpg|jpeg|gif|svg|ico)$" => "$0",
  "^/(.*)$" => "/index.html"
)

server.error-handler-404 = "/index.html"

mimetype.assign = (
  ".html" => "text/html",
  ".css"  => "text/css",
  ".js"   => "application/javascript",
  ".json" => "application/json",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif"  => "image/gif",
  ".svg"  => "image/svg+xml",
  ".ico"  => "image/x-icon"
)
