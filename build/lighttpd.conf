server.document-root = "/var/www/localhost/htdocs"

server.modules += ( "mod_rewrite" )

# SPA routing
url.rewrite-once = (
  "^/(assets/|.*\..+)$" => "$0",
  "^/.*$" => "/index.html"
)

mimetype.assign = (
  ".html" => "text/html",
  ".css"  => "text/css",
  ".js"   => "application/javascript",
  ".json" => "application/json",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif"  => "image/gif",
  ".svg"  => "image/svg+xml",
  ".ico"  => "image/x-icon"
)


server.error-handler-404 = "/index.html"
