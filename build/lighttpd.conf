server.document-root = "/var/www/localhost/htdocs"
server.port = 80

server.modules += ( "mod_rewrite", "mod_setenv" )

# Security: Disable server signature
server.tag = ""

# Security headers
setenv.add-response-header = (
    "X-Frame-Options" => "DENY",
    "X-Content-Type-Options" => "nosniff",
    "X-XSS-Protection" => "1; mode=block",
    "Content-Security-Policy" => "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self';",
    "Referrer-Policy" => "strict-origin-when-cross-origin"
)

# SPA routing
url.rewrite-once = (
  "^/(assets/|.*\..+)$" => "$0",
  "^/.*$" => "/index.html"
)

mimetype.assign = (
  ".html" => "text/html",
  ".css"  => "text/css",
  ".js"   => "application/javascript",
  ".json" => "application/json",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif"  => "image/gif",
  ".svg"  => "image/svg+xml",
  ".ico"  => "image/x-icon",
  ".webp" => "image/webp"
)

# Disable directory listing
dir-listing.activate = "disable"

server.error-handler-404 = "/index.html"
