<div class="about-content">
  @if (profile().aboutDescription) {
    <div class="about-description" [innerHTML]="profile().aboutDescription | markdown"></div>
  }

  @if (socialLinks().length > 0) {
    <div class="social-links">
      <h3>{{ 'ABOUT.SOCIAL_TITLE' | translate }}</h3>
      <div class="links-container">
        @for (link of socialLinks(); track link.platform) {
          <a [href]="link.url" target="_blank" class="social-btn">
            @if (link.icon) {
              <i [class]="link.icon"></i>
            } @else {
              <!-- Placeholder -->
              <span class="default-icon">🔗</span>
            }
            <span class="link-text">{{ link.platform }}</span>
            <span class="link-url-print"> ({{ link.url }})</span>
          </a>
        }
      </div>
    </div>
  }
</div>
