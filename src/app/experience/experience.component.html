<section class="resume-section">
  <h2>{{ 'EXPERIENCE.TITLE' | translate }}</h2>

  <div class="resume-section__list">
    @for (exp of experiences(); track exp.company + exp.startDate; let first = $first) {
      <app-experience-card [experience]="exp" [isFirst]="first" />
    }
  </div>
</section>
