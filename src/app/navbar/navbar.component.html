<header class="navbar">
  <div class="profile-picture">
    <img [src]="profile().profilePicturePath" alt="Profile picture" />
  </div>
  <div class="profile-content">
    <h1>{{ profile().name }}</h1>
    <h2>{{ profile().title }}</h2>
    <p>{{ profile().summary }}</p>
    <nav>
      <ul>
        <li>
          <a
            routerLink="/experience"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Expérience
          </a>
        </li>
        <li>
          <a
            routerLink="/education"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Études & Diplômes
          </a>
        </li>
        <li><a href="#" class="disabled">About</a></li>
        <!-- Test Tabs -->
        <li><a href="#" class="test-tab active-filled">Option 1</a></li>
        <li><a href="#" class="test-tab active-border">Option 2</a></li>
        <li><a href="#" class="test-tab active-underline">Option 3</a></li>
      </ul>
    </nav>
  </div>
</header>
