<header class="navbar" [class.is-sticky]="isSticky()">
  <div class="profile-picture">
    <img [src]="profile().profilePicturePath" alt="Profile picture" />
  </div>
  <div class="profile-content">
    <h1>{{ profile().name }}</h1>
    <h2>{{ profile().title }}</h2>
    <p class="profile-summary">{{ profile().summary }}</p>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-label]="(isMenuOpen() ? 'NAVBAR.CLOSE' : 'NAVBAR.MENU') | translate"
    >
      <i
        class="fas"
        [class.fa-chevron-down]="!isMenuOpen()"
        [class.fa-times]="isMenuOpen()"
        [class.rotate]="isMenuOpen()"
      ></i>
      <span>{{ (isMenuOpen() ? 'NAVBAR.CLOSE' : currentPageLabel()) | translate }}</span>
    </button>

    <nav [class.is-open]="isMenuOpen()">
      <ul>
        <li>
          <a
            routerLink="/experience"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            {{ 'NAVBAR.EXPERIENCE' | translate }}
          </a>
        </li>
        <li>
          <a
            routerLink="/education"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            {{ 'NAVBAR.EDUCATION' | translate }}
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            {{ 'NAVBAR.ABOUT' | translate }}
          </a>
        </li>
      </ul>
    </nav>
  </div>
  <div class="navbar-controls">
    <app-language-switch></app-language-switch>
    <app-theme-switch></app-theme-switch>
    <button
      class="print-button"
      type="button"
      [attr.aria-label]="'NAVBAR.PRINT' | translate"
      (click)="print()"
    >
      <i class="fas fa-print"></i>
    </button>
  </div>
</header>
