<div class="language-switch" [class.is-open]="isOpen()">
  <button
    class="current-lang"
    type="button"
    aria-haspopup="listbox"
    (click)="toggle($event)"
  >
    <span class="flag">{{ getLangFlag(currentLang()) }}</span>
    <span class="name">{{ getLangName(currentLang()) }}</span>
    <i class="fas fa-chevron-down"></i>
  </button>
  <ul class="lang-dropdown" role="listbox">
    <div class="dropdown-content">
      @for (lang of supportedLanguages; track lang) {
        <li
          (click)="switchLanguage($event, lang)"
          [class.active]="lang === currentLang()"
          role="option"
        >
          <span class="flag">{{ getLangFlag(lang) }}</span>
          <span class="name">{{ getLangName(lang) }}</span>
        </li>
      }
    </div>
  </ul>
</div>
