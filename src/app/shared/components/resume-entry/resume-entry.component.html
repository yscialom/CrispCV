<article class="resume-entry" [class.is-highlighted]="isHighlighted()">
  @if (permalinkFragment(); as fragment) {
    <div
      [id]="fragment"
      class="resume-entry-anchor"
      [class.resume-entry-anchor--first]="isFirst()"
    ></div>
  }

  @if (permalinkId()) {
    <button
      class="resume-entry__permalink-btn"
      (click)="copyLink($event)"
      [title]="'RESUME_ENTRY.COPY_LINK_TITLE' | translate"
      [attr.aria-label]="'RESUME_ENTRY.COPY_LINK_ARIA' | translate"
    >
      <i class="fas fa-link" aria-hidden="true"></i>
    </button>
  }

  <header class="resume-entry__header">
    <div class="resume-entry__row">
      <h3 class="resume-entry__title">{{ title() }}</h3>
      <span class="resume-entry__location">{{ location() }}</span>
    </div>

    <div class="resume-entry__row">
      <span class="resume-entry__subtitle">{{ subtitle() }}</span>
      <span
        class="resume-entry__dates"
        [title]="startDate() + (endDate() ? ' - ' + endDate() : '')"
      >
        {{ formattedDateRange() }}
        @if (startDate() | duration: endDate(); as dur) {
          ({{ dur }})
        }
      </span>
    </div>
  </header>

  <ng-content select="[entry-keywords]"></ng-content>

  <ng-content></ng-content>
</article>
