name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout config from pages branch
        run: |
          git fetch origin pages --depth=1 || echo "pages branch not found"
          if [ "${{ github.ref_name }}" = "pages" ] || git rev-parse --verify origin/pages >/dev/null 2>&1; then
            echo "Overwriting config files from pages branch"

            # Profile Configs
            if git ls-tree -r --name-only origin/pages | grep -q "config/profile\..*\.ts"; then
               git checkout origin/pages -- config/profile.*.ts
            else
               echo "No profile files found on pages branch"
            fi

            # Profile Picture
            if git ls-tree -r --name-only origin/pages | grep -q "config/profile-picture\."; then
               echo "Found profile picture on pages branch. Overwriting..."
               rm config/profile-picture.* 2>/dev/null || true
               git checkout origin/pages -- "config/profile-picture.*"
            else
               echo "No profile picture on pages branch. Keeping master version."
            fi

            # App Config
            if git ls-tree -r --name-only origin/pages | grep -q "config/app\.config\.ts"; then
               git checkout origin/pages -- config/app.config.ts
            else
               echo "Using default app.config.ts"
            fi

            # Update profile config to match the actual picture filename
            PICTURE_FILE=$(find config -maxdepth 1 -name "profile-picture.*" -not -name "*.ts" | head -n 1)
            if [ -n "$PICTURE_FILE" ]; then
              BASENAME=$(basename "$PICTURE_FILE")
              echo "Detected profile picture: $BASENAME. Updating config files..."
              sed -i "s/profilePicturePath: '.*'/profilePicturePath: '$BASENAME'/g" config/profile.*.ts
            fi
          else
            echo "pages branch not present, using default config"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build -- --configuration production --base-href /CrispCV/
          cp dist/CrispCV/browser/index.html dist/CrispCV/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/CrispCV/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
