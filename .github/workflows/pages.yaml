name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout config from pages branch
        run: |
          git fetch origin pages || echo "pages branch not found"
          if git rev-parse --verify origin/pages >/dev/null 2>&1; then
            echo "Overwriting config/profile.ts from pages branch"
            git checkout origin/pages -- config/profile.ts
          else
            echo "pages branch not present, using default config"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build -- --configuration production --base-href /CrispCV/
          cp dist/resume-app/browser/index.html dist/resume-app/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/resume-app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
